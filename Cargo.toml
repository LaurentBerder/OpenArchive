[package]
name = "openarchive"
version = "0.1.0"
edition = "2024"
authors = ["Laurent Berder"]
description = "A modern, high-performance, modular Rust-backed equivalent of 7-Zip"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "compress"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "xz"] }
zip = { version = "2.2", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "time"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
anyhow = "1.0"
thiserror = "2.0"
walkdir = "2.5"
memmap2 = "0.9"
indicatif = "0.17"
chrono = "0.4"
eframe = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "ico"] }
